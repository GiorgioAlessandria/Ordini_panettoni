[project]
name = "ordini-panettoni"
version = "0.1.0"
description = "Applicazione Flask per gestione ordini panettoni"
requires-python = ">=3.13.3"
dependencies = [
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pyodbc==5.3.0",
    "python-dateutil==2.9.0.post0",
    "qrcode==8.2",
    "reportlab==5.0.1",
    "sqlalchemy==2.0.54",
    "wfastcgi==3.0.0",
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "alembic==1.20.0",
    "flask_migrate==4.1.0"
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "ruff==0.16.10",
    "watchdog>=6.0.0",
]

# ============================================================
# UV
# ============================================================

[tool.uv]
default-groups = ["dev"]


# ============================================================
# RUFF
# ============================================================

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

exclude = [
    ".git",
    ".idea",
    ".venv",
    "__pycache__",
    "instance",
    "migrations",
]


[tool.ruff.lint]
select = [
    "E4", # errori import
    "E7", # errori sintattici/stile
    "E9", # errori runtime probabili
    "F", # Pyflakes
    "I", # ordinamento import
    "B", # flake8-bugbear
    "UP", # modernizzazione sintassi Python
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true


# ============================================================
# BASEDPYRIGHT
# ============================================================

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

include = [
    ".",
]

exclude = [
    ".venv",
    ".git",
    ".idea",
    "__pycache__",
    "instance",
    "migrations",
    "static",
    "templates",
]

reportMissingTypeStubs = false
